upstream tcysweb_gunicorn {
    server 127.0.0.1:8002;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name tcysweb.lostocayos-lostcys.com.mx;

    client_max_body_size 10m;

    location /static/ {
        alias /home/deploy/apps/tcysPedidosSucursales/current/staticfiles/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://tcysweb_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}

# Certbot (o un gestor TLS equivalente) debe transformar este bloque despues
# de que DNS resuelva al VPS. No se versionan rutas de llaves privadas.
